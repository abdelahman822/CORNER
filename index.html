

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Corner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-storage-compat.min.js"></script>
<style>
:root{
  --bg:#0a0d0c;
  --bg-elev:#141814;
  --bg-elev2:#1c211c;
  --pitch:#22a35a;
  --pitch-dark:#125c33;
  --gold:#e7b33e;
  --red:#d6455a;
  --white:#f4f6f3;
  --muted:#8b968f;
  --line:rgba(244,246,243,.09);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:#000;color:var(--white);
  font-family:'Inter',Tahoma,'Segoe UI',Arial,sans-serif;overflow:hidden;scrollbar-width:thin;scrollbar-color:rgba(231,179,62,.7) rgba(20,24,20,.25);}
#app{position:fixed;inset:0;display:flex;flex-direction:column;width:100%;margin:0;
  background:#000;box-shadow:none;overflow:auto;overscroll-behavior:contain;} 
#screen-splash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200;}
#screen-splash img{max-width:72%;max-height:72%;width:auto;height:auto;object-fit:contain;display:block;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:rgba(20,24,20,.25);border-radius:999px;}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(231,179,62,.95),rgba(34,163,90,.95));border-radius:999px;border:2px solid transparent;background-clip:padding-box;}
/* Responsive adjustments */
@media (max-width:520px){
  #app{max-width:520px}
}
@media (min-width:900px){
  .team-grid{grid-template-columns:1fr 1fr 1fr;gap:16px}
  .team-logo{width:86px;height:86px}
  .team-card{padding:18px}
}
.brand{font-family:Arial Black,Arial,sans-serif;letter-spacing:1px;font-weight:900;}
.hidden{display:none!important;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,textarea{font-family:inherit;outline:none;}
a{color:inherit;}

/* ---------- AUTH ---------- */
#screen-auth{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:32px 26px;background:
   radial-gradient(circle at 30% 15%,rgba(34,163,90,.25),transparent 55%),
   radial-gradient(circle at 80% 85%,rgba(231,179,62,.12),transparent 50%),var(--bg);}
.auth-logo{font-size:44px;color:var(--white);margin-bottom:2px;}
.auth-logo span{color:var(--pitch);}
.auth-sub{color:var(--muted);font-size:13px;margin-bottom:34px;letter-spacing:.5px;}
.photo-picker{width:104px;height:104px;border-radius:20px;border:2px dashed var(--line);
  display:flex;align-items:center;justify-content:center;background:var(--bg-elev);margin-bottom:22px;
  position:relative;overflow:hidden;flex-shrink:0;}
.photo-picker img{width:100%;height:100%;object-fit:cover;}
.photo-picker .ph{color:var(--muted);font-size:30px;}
.auth-input{width:100%;max-width:300px;background:var(--bg-elev);border:1px solid var(--line);
  border-radius:14px;padding:15px 16px;color:var(--white);font-size:15px;margin-bottom:14px;text-align:center;}
.btn-primary{width:100%;max-width:300px;background:var(--pitch);color:#08150d;font-weight:800;
  font-size:15px;border-radius:14px;padding:15px;margin-bottom:12px;transition:transform .15s;}
.btn-primary:active{transform:scale(.97);}
.btn-google{width:100%;max-width:300px;background:var(--bg-elev2);color:var(--white);
  font-size:14px;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;
  border:1px solid var(--line);}
.divider-or{color:var(--muted);font-size:12px;margin:10px 0;}
.auth-hint{color:var(--muted);font-size:11px;margin-top:18px;text-align:center;max-width:280px;line-height:1.7;}

/* ---------- ONBOARDING ---------- */
#screen-onboard{flex:1;display:flex;flex-direction:column;padding:20px 20px calc(20px + var(--safe-bottom));min-height:0;}
#ob-step-team,#ob-step-follow,#ob-step-bg{flex:1;display:flex;flex-direction:column;min-height:0;}
.ob-title{font-size:20px;font-weight:800;margin:10px 0 4px;}
.ob-sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
.league-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;}
.league-tab{flex-shrink:0;padding:9px 16px;border-radius:20px;background:var(--bg-elev);
  color:var(--muted);font-size:13px;font-weight:700;border:1px solid var(--line);}
.league-tab.active{background:var(--pitch);color:#08150d;border-color:var(--pitch);}
.team-grid{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:14px;}
.team-grid::-webkit-scrollbar{width:10px;}
.team-grid::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:999px;}
.team-grid::-webkit-scrollbar-thumb{background:rgba(231,179,62,.45);border-radius:999px;}
.team-card{display:flex;flex-direction:row;align-items:center;gap:12px;padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border:1px solid var(--line);cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;text-align:right;}
.team-card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.6)}
.team-card .team-left{width:84px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.team-card .team-left img{width:72px;height:72px;border-radius:12px;object-fit:contain;background:var(--bg-elev)}
.team-card .team-right{flex:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:center}
.team-card .label{font-size:15px;font-weight:900;color:var(--white);margin-bottom:4px}
.team-card .sublabel{font-size:13px;color:var(--muted)}
.team-card.selected{border-color:var(--gold);box-shadow:0 22px 50px rgba(231,179,62,.06)}
.team-card .chk{position:absolute;top:8px;left:8px;font-size:14px;color:var(--gold);}
.ob-footer{display:flex;gap:10px;padding-top:12px;padding-bottom:12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.12));position:sticky;bottom:0;z-index:8;padding:12px 12px;backdrop-filter:blur(6px);}
.btn-ghost{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:14px;padding:14px;font-size:14px;font-weight:700;min-width:0;}
.btn-ghost.profile-action-btn{flex:none;min-width:110px;padding:10px 12px;font-size:13px;}
.btn-next{flex:2;background:var(--pitch);color:#08150d;border-radius:14px;padding:14px;font-weight:800;font-size:14px;}
.bg-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.bg-opt{height:150px;border-radius:18px;border:3px solid transparent;position:relative;overflow:hidden;
  display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:800;}
.bg-opt.selected{border-color:var(--gold);}
.bg-opt span{background:rgba(0,0,0,.4);padding:4px 8px;border-radius:8px;}

/* ---------- SHELL / NAV ---------- */
#screen-shell{flex:1;display:flex;flex-direction:column;min-height:0;}
.main-view{flex:1;min-height:0;position:relative;overflow:hidden;}
.tab-panel{position:absolute;inset:0;overflow-y:auto;}
.bottom-nav{display:flex;align-items:center;justify-content:space-around;
  background:rgba(10,13,12,.96);border-top:1px solid var(--line);
  padding:9px 4px calc(9px + var(--safe-bottom));backdrop-filter:blur(10px);z-index:50;}
.nav-btn{background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;
  gap:3px;font-size:9px;font-weight:700;padding:4px 8px;}
.nav-btn.active{color:var(--pitch);}
.nav-btn .ic{font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;}
.nav-btn .ic svg{width:22px;height:22px;}
.nav-plus{width:42px;height:32px;background:var(--pitch);border-radius:10px;display:flex;
  align-items:center;justify-content:center;color:#08150d;font-size:20px;font-weight:900;margin-top:-2px;}

/* ---------- FEED ---------- */
.feed-scroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;}
.video-slide{height:100%;width:100%;scroll-snap-align:start;position:relative;background:#000;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.video-slide video{
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
.vs-top{position:absolute;top:calc(14px + var(--safe-top));left:14px;right:14px;display:flex;
  justify-content:space-between;z-index:5;}
.vs-top-right{display:flex;gap:8px;}
.icon-btn{background:rgba(0,0,0,.4);width:34px;height:34px;border-radius:50%;color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;position:relative;}
.icon-btn svg{width:17px;height:17px;}
.notif-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--bg);}
.vs-side{position:absolute;left:10px;bottom:110px;display:flex;flex-direction:column;align-items:center;gap:18px;z-index:5;}
.side-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:#fff;}
.side-btn .circ{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;
  align-items:center;justify-content:center;font-size:22px;border:2px solid transparent;}
.side-btn .circ svg{width:23px;height:23px;}
.side-btn .circ.avatar{padding:0;overflow:hidden;background:var(--bg-elev2);}
.side-btn .circ.avatar img{width:100%;height:100%;object-fit:cover;}
.side-btn .cnt{font-size:11px;font-weight:800;}
.side-btn.active-goal .circ{background:var(--pitch);border-color:var(--pitch);}
.side-btn.active-red .circ{background:var(--red);border-color:var(--red);}
.follow-badge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--gold);
  color:#3a2a05;font-size:13px;font-weight:900;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;}
.vs-bottom{position:absolute;left:14px;right:78px;bottom:calc(16px + var(--safe-bottom));z-index:5;color:#fff;}
.vs-channel{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.vs-channel .cname{font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:4px;}
.vs-fbtn{background:transparent;border:1.5px solid #fff;color:#fff;font-size:11px;font-weight:800;
  padding:3px 12px;border-radius:7px;}
.vs-fbtn.following{background:rgba(255,255,255,.25);}
.vs-desc{font-size:13.5px;line-height:1.5;text-shadow:0 1px 4px rgba(0,0,0,.6);}
.vs-desc .tag{color:var(--gold);font-weight:700;}
.goal-pop{position:absolute;font-size:70px;pointer-events:none;animation:goalpop .9s ease-out forwards;z-index:9;}
@keyframes goalpop{0%{transform:scale(.3);opacity:0;}30%{transform:scale(1.15);opacity:1;}70%{opacity:1;}100%{transform:scale(1.3) translateY(-40px);opacity:0;}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
  color:var(--muted);text-align:center;padding:40px;gap:10px;}
.empty-state .big{font-size:38px;}
.empty-state .big svg{width:44px;height:44px;color:var(--muted);}

/* ---------- MATCH CENTER / MATCH CARDS ---------- */
.match-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-bottom:14px;position:relative;overflow:hidden;}
.match-card.is-live{border-color:rgba(214,69,90,.6);box-shadow:0 0 16px rgba(214,69,90,.15);}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;color:var(--muted);}
.match-league{font-weight:800;color:var(--white);display:flex;align-items:center;gap:6px;}
.match-status{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg-elev2);font-weight:700;}
.match-status.live{background:rgba(214,69,90,.2);color:var(--red);border:1px solid rgba(214,69,90,.4);animation:pulse 1.8s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.5;}100%{opacity:1;}}
.match-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;padding:14px 0;border-top:1px solid rgba(244,246,243,.08);border-bottom:1px solid rgba(244,246,243,.08);margin-bottom:12px;}
.team-box{display:flex;flex-direction:column;align-items:center;gap:6px;}
.team-box img{width:40px;height:40px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.03);padding:2px;}
.team-name{font-weight:800;font-size:13.5px;}
.match-score{font-size:22px;font-weight:900;letter-spacing:1px;color:var(--gold);}
.match-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.match-actions button{flex:1 1 calc(50% - 8px);background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--white);border-radius:14px;padding:10px 12px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.match-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.match-meta .match-btn{background:transparent;border:none;color:var(--gold);font-weight:800;cursor:pointer;padding:0;}

/* Match Center Filter Bar & Standings Table */
.match-subnav{display:flex;gap:6px;overflow-x:auto;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.match-subbtn{flex-shrink:0;padding:8px 14px;border-radius:12px;background:var(--bg-elev);color:var(--muted);font-size:12px;font-weight:800;border:1px solid var(--line);}
.match-subbtn.active{background:var(--pitch);color:#08150d;border-color:var(--pitch);}
.api-key-banner{background:rgba(231,179,62,.1);border:1px dashed var(--gold);color:var(--gold);padding:10px 14px;border-radius:12px;font-size:11.5px;margin-bottom:12px;line-height:1.5;text-align:center;}

.standings-table{width:100%;border-collapse:collapse;font-size:12px;text-align:center;}
.standings-table th{background:var(--bg-elev2);color:var(--muted);padding:10px 6px;font-weight:800;}
.standings-table td{padding:10px 6px;border-bottom:1px solid var(--line);}
.standings-table .t-name{text-align:right;display:flex;align-items:center;gap:8px;font-weight:800;}
.standings-table img{width:20px;height:20px;object-fit:contain;}

/* ---------- SHEETS / MODALS ---------- */
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;}
.sheet{background:var(--bg-elev);width:100%;border-radius:20px 20px 0 0;max-height:78%;display:flex;
  flex-direction:column;animation:sheetup .22s ease-out;}
@keyframes sheetup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 6px;}
.sheet-title{text-align:center;font-weight:800;font-size:14px;padding:4px 14px 10px;border-bottom:1px solid var(--line);}
.sheet-body{flex:1;overflow-y:auto;padding:10px 14px;}
.comment-row{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);}
.comment-row img{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg-elev2);}
.comment-name{font-size:12px;font-weight:800;color:var(--gold);}
.comment-text{font-size:13px;margin-top:2px;line-height:1.4;}
.comment-actions{display:flex;gap:14px;margin-top:5px;font-size:11px;color:var(--muted);}
.sheet-input-bar{display:flex;gap:8px;padding:10px 14px calc(10px + var(--safe-bottom));border-top:1px solid var(--line);}
.sheet-input-bar input{flex:1;background:var(--bg-elev2);border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;color:#fff;font-size:13px;}
.sheet-input-bar button{background:var(--pitch);color:#08150d;font-weight:800;border-radius:20px;padding:0 16px;font-size:13px;}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14px;}
.list-row .chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;}
.list-row.saved .chk{background:var(--pitch);border-color:var(--pitch);color:#08150d;}
.new-list-row{display:flex;gap:8px;padding:10px 0;}
.new-list-row input{flex:1;background:var(--bg-elev2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;}
.new-list-row button{background:var(--gold);color:#3a2a05;font-weight:800;border-radius:10px;padding:0 14px;}
.share-row{display:flex;align-items:center;gap:12px;padding:13px 0;font-size:14px;border-bottom:1px solid var(--line);}
.menu-item{padding:14px 4px;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;}

/* ---------- NOTIFICATIONS ---------- */
.notif-row{display:flex;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer;transition:background .2s;}
.notif-row:hover{background:rgba(255,255,255,.04);}
.notif-row.unread{background:rgba(34,163,90,.06);}
.notif-row img{width:38px;height:38px;border-radius:12px;object-fit:cover;background:var(--bg-elev2);flex-shrink:0;}
.notif-icon{width:38px;height:38px;border-radius:12px;background:var(--bg-elev2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);}
.notif-icon svg{width:18px;height:18px;}
.notif-text{font-size:13px;line-height:1.5;}
.notif-text b{font-weight:800;}
.notif-preview{font-size:12px;color:var(--muted);margin-top:4px;}
.notif-time{font-size:11px;color:var(--muted);margin-top:3px;}
.notif-list-body{display:flex;flex-direction:column;gap:8px;}

/* ---------- SEARCH ---------- */
.search-bar-wrap{display:flex;gap:8px;padding:calc(12px + var(--safe-top)) 14px 10px;position:sticky;top:0;
  background:var(--bg);z-index:5;border-bottom:1px solid var(--line);}
.search-bar-wrap input{flex:1;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;color:#fff;font-size:14px;}
.search-bar-wrap button{background:var(--pitch);color:#08150d;font-weight:800;border-radius:14px;padding:0 16px;font-size:13px;}
.history-chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg-elev);border:1px solid var(--line);
  border-radius:16px;padding:8px 12px;margin:4px 6px 4px 0;font-size:12.5px;}
.history-chip .x{color:var(--muted);font-size:11px;}
.search-list{padding:6px 14px;}
.sr-user{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.sr-user img{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--bg-elev2);}
.sr-vid-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:8px;}
.sr-vid-grid .thumb{aspect-ratio:9/14;background:var(--bg-elev2);border-radius:8px;overflow:hidden;position:relative;}
.sr-vid-grid .thumb video{width:100%;height:100%;object-fit:cover;}
.sr-vid-grid .thumb .vc{position:absolute;bottom:4px;right:6px;font-size:10px;background:rgba(0,0,0,.5);padding:2px 5px;border-radius:5px;}
.section-label{font-size:12px;color:var(--muted);font-weight:800;margin:14px 0 6px;}

/* ---------- UPLOAD ---------- */
.upload-panel{padding:calc(16px + var(--safe-top)) 18px 20px;display:flex;flex-direction:column;height:100%;}
.upload-drop{border:2px dashed var(--line);border-radius:18px;height:180px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--muted);gap:8px;background:var(--bg-elev);position:relative;overflow:hidden;}
.upload-drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload-drop .lbl{position:relative;z-index:2;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:8px;}
.upload-ta{margin-top:14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;color:#fff;font-size:14px;min-height:90px;resize:none;}
.upload-progress{height:6px;background:var(--bg-elev2);border-radius:4px;overflow:hidden;margin-top:14px;}
.upload-progress .bar{height:100%;background:var(--pitch);width:0%;transition:width .2s;}

/* ---------- VAR ---------- */
.var-card{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;margin:12px 14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.5);}
.var-card img{width:100%;max-height:260px;object-fit:cover;display:block;background:#000;}
.var-body{padding:14px 16px;}
.var-q{font-size:14px;line-height:1.6;margin-bottom:10px;}
.var-votes{display:flex;gap:8px;margin-bottom:10px;}
.var-vote{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg-elev2);
  font-size:13px;font-weight:800;color:var(--white);}
.var-vote.yes.picked{background:var(--pitch);color:#08150d;border-color:var(--pitch);}
.var-vote.no.picked{background:var(--red);color:#fff;border-color:var(--red);}
.var-bar{height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--bg-elev2);margin-bottom:6px;}
.var-bar .y{background:var(--pitch);height:100%;}
.var-bar .n{background:var(--red);height:100%;}
.var-pct{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
.fab{position:absolute;left:16px;bottom:calc(16px + var(--safe-bottom));width:52px;height:52px;border-radius:50%;
  background:var(--gold);color:#3a2a05;font-size:26px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:20;}

/* ---------- COMMUNITY ---------- */
.post-box{margin:calc(12px + var(--safe-top)) 14px 6px;background:var(--bg-elev);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;}
.post-box textarea{width:100%;background:transparent;border:none;color:#fff;font-size:14px;resize:none;min-height:50px;}
.post-box .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.post-card{margin:0 14px 14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.45);}
.post-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.post-head img{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--bg-elev2);}
.post-head .nm{font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;}
.post-head .tm{font-size:11px;color:var(--muted);}
.post-text{font-size:14px;line-height:1.6;margin-bottom:8px;}
.post-img{width:100%;border-radius:10px;margin-bottom:8px;max-height:320px;object-fit:cover;}
.post-actions{display:flex;gap:16px;font-size:12.5px;color:var(--muted);}
.post-actions .liked{color:var(--pitch);}

/* ---------- PROFILE ---------- */
.profile-wrap{padding:calc(14px + var(--safe-top)) 16px 24px;}
.player-card{position:relative;border-radius:22px;padding:22px 18px;min-height:210px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(231,179,62,.4);}
.player-card::before{content:"";position:absolute;top:-40%;right:-30%;width:220px;height:220px;
  background:radial-gradient(circle,rgba(231,179,62,.35),transparent 65%);}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;}
.pc-avatar{width:66px;height:66px;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:var(--bg-elev2);}
.pc-avatar img{width:100%;height:100%;object-fit:cover;}
.pc-followers{text-align:center;}
.pc-followers b{font-size:26px;display:block;font-family:Arial Black,sans-serif;}
.pc-followers span{font-size:10px;color:rgba(244,246,243,.75);}
.pc-name{font-size:19px;font-weight:900;margin-top:14px;position:relative;z-index:2;display:flex;align-items:center;gap:6px;}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;color:var(--pitch);flex-shrink:0;}
.verified-badge svg{width:16px;height:16px;}
.pc-team{font-size:12.5px;color:var(--gold);font-weight:700;margin-top:2px;position:relative;z-index:2;display:flex;align-items:center;gap:7px;}
.pc-team-logo{width:22px;height:22px;border-radius:6px;object-fit:contain;background:rgba(255,255,255,.08);flex-shrink:0;}
.pc-crest-bg{position:absolute;top:-18px;left:-18px;width:150px;height:150px;object-fit:contain;opacity:.12;z-index:1;pointer-events:none;filter:saturate(0) brightness(1.6);}
.followed-teams-label{font-size:12px;color:var(--muted);font-weight:800;margin:16px 0 8px;}
.followed-teams-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;}
.ft-chip{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;width:58px;}
.ft-chip img{width:44px;height:44px;border-radius:12px;object-fit:contain;background:var(--bg-elev);border:1px solid var(--line);padding:4px;}
.ft-chip span{font-size:9.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px;}
.profile-stats{display:flex;gap:10px;margin:16px 0;}
.pstat{flex:1;background:var(--bg-elev);border-radius:12px;padding:10px;text-align:center;}
.pstat b{display:block;font-size:16px;}
.pstat span{font-size:10.5px;color:var(--muted);}
.badges-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;}
.badge-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;background:var(--bg-elev);border:1px solid rgba(231,179,62,.35);
  border-radius:20px;padding:7px 12px;font-size:11.5px;font-weight:800;color:var(--gold);white-space:nowrap;}
.badge-chip svg{width:14px;height:14px;}
.profile-actions{display:flex;gap:10px;margin-bottom:16px;}
.profile-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:8px;}
.ptab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;}
.ptab.active{color:var(--white);border-color:var(--pitch);}
.my-video-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.my-video-grid .thumb{aspect-ratio:9/14;background:var(--bg-elev);border-radius:8px;overflow:hidden;position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s}
.my-video-grid .thumb:hover{transform:translateY(-6px);box-shadow:0 12px 26px rgba(0,0,0,.6)}
.my-video-grid .thumb video{width:100%;height:100%;object-fit:cover;}
.my-video-grid .thumb .vc{position:absolute;bottom:3px;right:5px;font-size:9.5px;background:rgba(0,0,0,.55);padding:2px 5px;border-radius:5px;}
.list-tile{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;}
.list-tile .n{width:38px;height:38px;border-radius:10px;background:var(--bg-elev);display:flex;align-items:center;justify-content:center;color:var(--gold);}

/* ---------- SETTINGS ---------- */
.settings-wrap{padding:calc(14px + var(--safe-top)) 18px 24px;}
.set-section{margin-bottom:18px;}
.set-label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:8px;}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:var(--bg-elev);
  border-radius:12px;margin-bottom:8px;font-size:14px;}
.toggle{width:42px;height:24px;border-radius:14px;background:var(--bg-elev2);position:relative;transition:.2s;}
.toggle.on{background:var(--pitch);}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.toggle.on::after{transform:translateX(-18px);}
.btn-danger{width:100%;background:rgba(214,69,90,.15);color:var(--red);border-radius:12px;padding:13px;font-weight:800;font-size:14px;margin-bottom:8px;}
.toast{position:absolute;bottom:calc(90px + var(--safe-bottom));left:50%;transform:translateX(-50%);
  background:rgba(20,24,20,.95);border:1px solid var(--line);color:#fff;font-size:13px;padding:10px 18px;
  border-radius:12px;z-index:100;white-space:nowrap;animation:toastin .25s ease-out;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}
.top-header{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--safe-top)) 16px 12px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:4;}
.top-header .back{font-size:20px;color:var(--muted);display:flex;align-items:center;}
.top-header .back svg{width:20px;height:20px;}
.top-header .t{font-weight:800;font-size:16px;flex:1;}
.loader{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);}
.ob-signout{text-align:center;font-size:11px;color:var(--muted);margin-bottom:8px;}
.ob-signout span{color:var(--gold);text-decoration:underline;cursor:pointer;}
.footer-brand{text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:1px;margin-top:6px;}
.footer-brand b{color:var(--gold);}
</style>

function timeAgo(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s<60) return "الآن";
  if(s<3600) return Math.floor(s/60)+" د";
  if(s<86400) return Math.floor(s/3600)+" س";
  return Math.floor(s/86400)+" ي";
}

async function finishProfileSetup(user, name, file, existingPhotoURL){
  let photoURL = existingPhotoURL || "";
  if(file){
    const ref = storage.ref(`profile_photos/${user.uid}.jpg`);
    await ref.put(file);
    photoURL = await ref.getDownloadURL();
  }
  await user.updateProfile({displayName:name, photoURL});
  const userRef = db.collection("users").doc(user.uid);
  const snap = await userRef.get();
  if(!snap.exists){
    await userRef.set({
      uid:user.uid, displayName:name, displayNameLower:name.toLowerCase(),
      photoURL, followersCount:0, followingCount:0, favTeam:null, followTeams:[],
      cardBg:"night", onboarded:false, notifications:true, blockedUsers:[], searchHistory:[],
      verified:false, videosCount:0, createdAt:FieldValue.serverTimestamp()
    });
  }
  currentUser = user;
  const fresh = await userRef.get();
  userData = fresh.data();

  try{
    const pending = localStorage.getItem('pendingOnboard');
    if(pending){
      const p = JSON.parse(pending);
      await userRef.update({
        favTeam: p.favTeam || userData.favTeam,
        followTeams: p.followTeams || userData.followTeams || [],
        cardBg: p.cardBg || userData.cardBg || 'night',
        onboarded: true
      });
      const refreshed = await userRef.get(); userData = refreshed.data();
      localStorage.removeItem('pendingOnboard');
      enterApp();
      return;
    }
  }catch(e){ console.warn('applyPendingOnboard failed', e); }

  if(!userData.onboarded){ showOnboarding(); } else { enterApp(); }
}

auth.onAuthStateChanged(async user=>{
  if(user && !currentUser){
    currentUser = user;
    const snap = await db.collection("users").doc(user.uid).get();
    if(snap.exists){
      userData = snap.data();
      if(userData.onboarded) enterApp(); else showOnboarding();
      return;
    }
  }
  if(!user){
    hideSplash();
    $("#screen-auth").classList.remove("hidden");
    $("#screen-onboard").classList.add("hidden");
    $("#screen-shell").classList.add("hidden");
  }
});

const TEAM_LOGO_CACHE = {};
const TEAM_LOGO_PENDING = {};

function fallbackTeamAvatar(team){
  return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(team) +
    '&background=17231a&color=e7b33e&size=256&bold=true&font-size=0.4';
}

async function fetchWikiThumbnail(pageTitle){
  try{
    const resp = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+pageTitle, {headers:{'Accept':'application/json'}});
    if(resp.ok){
      const jd = await resp.json();
      if(jd && jd.originalimage && jd.originalimage.source) return jd.originalimage.source;
      if(jd && jd.thumbnail && jd.thumbnail.source) return jd.thumbnail.source;
    }
  }catch(e){}
  return null;
}

async function resolveTeamLogo(team){
  if(!team) return fallbackTeamAvatar('؟');
  const normalized = String(team).trim();
  if(normalized === 'بورنموث' || normalized === 'Bournemouth'){
    TEAM_LOGO_CACHE[team] = './1.png';
    return TEAM_LOGO_CACHE[team];
  }
  if(TEAM_LOGO_CACHE[team]) return TEAM_LOGO_CACHE[team];
  if(TEAM_LOGO_PENDING[team]) return TEAM_LOGO_PENDING[team];
  const p = (async ()=>{
    const page = TEAM_WIKI_MAP[team];
    if(page){
      const url = await fetchWikiThumbnail(page);
      if(url) { TEAM_LOGO_CACHE[team]=url; return url; }
    }
    try{
      const ar = await fetch('https://ar.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(team));
      if(ar.ok){
        const jd = await ar.json();
        const src = (jd.originalimage && jd.originalimage.source) || (jd.thumbnail && jd.thumbnail.source);
        if(src){ TEAM_LOGO_CACHE[team]=src; return src; }
      }
    }catch(e){}
    const fb = fallbackTeamAvatar(team);
    TEAM_LOGO_CACHE[team]=fb;
    return fb;
  })();
  TEAM_LOGO_PENDING[team] = p;
  const result = await p;
  delete TEAM_LOGO_PENDING[team];
  return result;
}

function isBlocked(ownerUid){
  const list = Array.isArray(userData && userData.blockedUsers) ? userData.blockedUsers : [];
  return list.includes(ownerUid);
}

async function blockUser(ownerUid){
  const u = uid();
  if(!u || !ownerUid){ toast('تعذر الحظر'); return false; }
  const currentBlocked = Array.isArray(userData && userData.blockedUsers) ? userData.blockedUsers : [];
  if(currentBlocked.includes(ownerUid)){
    toast('هذا الحساب محظور بالفعل');
    return true;
  }
  try{
    const userRef = db.collection('users').doc(u);
    await userRef.set({ blockedUsers: FieldValue.arrayUnion(ownerUid) }, { merge: true });
    const fresh = await userRef.get();
    userData = fresh.data() || {};
    if(!Array.isArray(userData.blockedUsers)) userData.blockedUsers = [];
    if(!userData.blockedUsers.includes(ownerUid)) userData.blockedUsers.push(ownerUid);
    if(Array.isArray(feedVideos)){
      feedVideos = feedVideos.filter(fv => fv.ownerUid !== ownerUid);
      drawFeed();
    }
    toast('تم الحظر، لن تشاهد فيديوهات هذا الحساب');
    return true;
  }catch(err){
    console.error('blockUser failed', err);
    toast('فشل الحظر، جرّب مرة أخرى');
    return false;
  }
}
const HOME_FEED_LIMIT = 30;
function prioritizeHomeFeed(videos){
  const following = Array.isArray(userData && userData.followingChannels) ? userData.followingChannels : [];
  const favTeam = userData && userData.favTeam;
  const followedSet = new Set(following || []);
  const followed = [];
  const sameTeam = [];
  const others = [];
  videos.forEach(v=>{
    if(followedSet.has(v.ownerUid)) followed.push(v);
    else if(favTeam && v.ownerFavTeam === favTeam) sameTeam.push(v);
    else others.push(v);
  });
  const sortByDate = arr => arr.sort((a,b)=>((b.createdAt && b.createdAt.seconds?b.createdAt.seconds:0) - (a.createdAt && a.createdAt.seconds?a.createdAt.seconds:0)));
  sortByDate(followed);
  sortByDate(sameTeam);
  sortByDate(others);
  const targetFollowed = Math.ceil(HOME_FEED_LIMIT * 0.8);
  const targetOthers = HOME_FEED_LIMIT - Math.min(targetFollowed, followed.length);
  const selected = followed.slice(0, targetFollowed);
  const remainder = sameTeam.concat(others).slice(0, targetOthers);
  return selected.concat(remainder).slice(0, HOME_FEED_LIMIT);
}
function renderHomeFeed(){
  const panel=$("#panel-home");
  if(feedUnsub) return;
  panel.innerHTML = `<div class="feed-scroll" id="feedScroll"><div class="loader">جاري تحميل الفيديوهات...</div></div>`;
  feedUnsub = db.collection("videos").orderBy("createdAt","desc").limit(60)
    .onSnapshot(qs=>{
      if(!qs){ panel.innerHTML=`<div class="empty-state"><div class="big">⚠️</div>تعذر تحميل الفيديوهات</div>`; return; }
      const allVideos = qs.docs.map(d=>({id:d.id,...d.data()})).filter(v=>!isBlocked(v.ownerUid));
      feedVideos = prioritizeHomeFeed(allVideos);
      drawFeed();
    }, err=>{ console.error(err); panel.innerHTML=`<div class="empty-state"><div class="big">⚠️</div>تعذر تحميل الفيديوهات</div>`; });
}

function drawFeed(){
  const scrollEl=$("#feedScroll");
  if(!scrollEl) return;
  if(feedVideos.length===0){
    scrollEl.innerHTML = `<div class="empty-state"><div class="big">${icon('video')}</div>لسه مفيش فيديوهات<br>كن أول واحد ينزل فيديو</div>`;
    return;
  }

  const existingSlides = scrollEl.querySelectorAll(".video-slide");
  if(existingSlides.length > 0) {
    feedVideos.forEach((v) => {
      const slide = scrollEl.querySelector(`.video-slide[data-id="${v.id}"]`);
      if(slide) {
        updateSlideFromData(slide, v);
      }
    });
    return;
  }

  scrollEl.innerHTML = feedVideos.map((v,i)=>videoSlideHTML(v,i)).join("");
  scrollEl.querySelectorAll(".video-slide").forEach((slide,i)=>bindVideoSlide(slide, feedVideos[i]));

  setupFeedObserver();
}

let feedObserver = null;
function setupFeedObserver(){
  if(feedObserver) feedObserver.disconnect();
  feedObserver = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      const vidEl = en.target.querySelector("video");
      if(!vidEl) return;
      if(en.isIntersecting && en.intersectionRatio>0.6){
        vidEl.play().catch(()=>{});
        const vId = en.target.dataset.id;
        activeVideoIndex = feedVideos.findIndex(v=>v.id===vId);
        maybeCountView(vId);
      } else {
        vidEl.pause();
      }
    });
  },{threshold:[0,0.6]});
  document.querySelectorAll(".video-slide").forEach(s=>feedObserver.observe(s));
}

function updateSlideFromData(slide, v){
  const vid = slide.querySelector('video');
  if(vid && vid.src !== v.videoURL){ try{ const cur = vid.currentTime; vid.src = v.videoURL; vid.currentTime = cur; }catch(e){} }
  const cname = slide.querySelector('.cname'); if(cname) cname.innerHTML = esc(v.ownerName||'مستخدم') + verifiedBadge(v.ownerVerified);
  const avatarImg = slide.querySelector('.circ.avatar img'); if(avatarImg) avatarImg.src = v.ownerPhoto||avatarImg.src;
  const goalBtn = slide.querySelector('[data-act="goal"] .cnt'); if(goalBtn) goalBtn.textContent = fmtNum(v.goalsCount);
  const redBtn = slide.querySelector('[data-act="red"] .cnt'); if(redBtn) redBtn.textContent = fmtNum(v.redCount);
  const commBtn = slide.querySelector('[data-act="comments"] .cnt'); if(commBtn) commBtn.textContent = fmtNum(v.commentsCount);
  const desc = slide.querySelector('.vs-desc'); if(desc) desc.innerHTML = renderHashtags(v.description||'');
  
  const myReaction = (v.reactions && v.reactions[uid()]) || null;
  const goalSide = slide.querySelector('[data-act="goal" ]'); if(goalSide) goalSide.classList.toggle('active-goal', myReaction==='goal');
  const redSide = slide.querySelector('[data-act="red" ]'); if(redSide) redSide.classList.toggle('active-red', myReaction==='red');
}

function maybeCountView(videoId){
  if(!videoId || sessionViewedIds.has(videoId)) return;
  sessionViewedIds.add(videoId);
  setTimeout(()=>{
    db.collection("videos").doc(videoId).update({views:FieldValue.increment(1)}).catch(()=>{});
  },3000);
}
function videoSlideHTML(v,i){
  const myReaction = (v.reactions && v.reactions[uid()]) || null;
  const following = (userData && userData.followingChannels && userData.followingChannels.includes(v.ownerUid));
  return `
    <div class="video-slide" data-id="${v.id}" data-owner="${v.ownerUid}">
    <video src="${esc(v.videoURL)}" playsinline autoplay loop preload="metadata"></video>

function bindVideoSlide(slide, v){
  const vidEl = slide.querySelector("video");
  const muteBtn = slide.querySelector(".mute-btn");
  vidEl.muted = false;
  muteBtn.innerHTML = vidEl.muted ? icon('muteOff') : icon('mute');
  muteBtn.addEventListener("click",e=>{
    e.stopPropagation(); vidEl.muted=!vidEl.muted; e.currentTarget.innerHTML = vidEl.muted?icon('muteOff'):icon('mute');
  });
  slide.querySelector(".notif-btn").addEventListener("click", e=>{ e.stopPropagation(); openNotificationsSheet(); });
  slide.addEventListener("click",e=>{
    if(e.target.closest(".vs-top,.vs-side,.vs-bottom")) return;
    if(vidEl.paused) vidEl.play(); else vidEl.pause();
  });
  slide.addEventListener("dblclick",e=>{
    doReaction(v.id,"goal");
    spawnGoalPop(slide, e.clientX - slide.getBoundingClientRect().left, e.clientY - slide.getBoundingClientRect().top);
  });
  slide.querySelector('[data-act="goal"]').addEventListener("click",()=>doReaction(v.id,"goal"));
  slide.querySelector('[data-act="red"]').addEventListener("click",()=>doReaction(v.id,"red"));
  slide.querySelector('[data-act="comments"]').addEventListener("click",()=>openCommentsSheet(v.id));
  slide.querySelector('[data-act="save"]').addEventListener("click",()=>openSaveSheet(v.id));
  slide.querySelector('[data-act="share"]').addEventListener("click",()=>openShareSheet(v.id));
  slide.querySelector('[data-act="follow"]').addEventListener("click",()=>toggleFollowChannel(v.ownerUid));
  slide.querySelector('[data-act="message"]').addEventListener("click",()=>openChatSheet(v.ownerUid, v.ownerName, v.ownerPhoto));
  slide.querySelector('.menu-btn').addEventListener("click",()=>openVideoMenuSheet(v));
  slide.querySelectorAll('[data-act="profile-open"]').forEach(b=>b.addEventListener("click",()=>openOtherProfile(v.ownerUid)));
  slide.querySelectorAll(".tag").forEach(t=>t.addEventListener("click",e=>{
    e.stopPropagation();
    switchTab("search");
    setTimeout(()=>{ $("#searchInput").value="#"+t.dataset.hashtag; runSearch("#"+t.dataset.hashtag); },50);
  }));
}
function spawnGoalPop(slide,x,y){
  const el=document.createElement("div"); el.className="goal-pop"; el.textContent="⚽";
  el.style.left=(x-35)+"px"; el.style.top=(y-35)+"px";
  slide.appendChild(el); setTimeout(()=>el.remove(),900);
}

async function doReaction(videoId, type){
  const u=uid(); if(!u){toast("سجل دخولك الأول");return;}

  const slide = document.querySelector(`.video-slide[data-id="${videoId}"]`);
  if(slide) {
    const goalBtn = slide.querySelector('[data-act="goal"]');
    const redBtn = slide.querySelector('[data-act="red"]');
    const goalCnt = goalBtn ? goalBtn.querySelector('.cnt') : null;
    const redCnt = redBtn ? redBtn.querySelector('.cnt') : null;

    let gCount = goalCnt ? (parseInt(goalCnt.textContent) || 0) : 0;
    let rCount = redCnt ? (parseInt(redCnt.textContent) || 0) : 0;

    if(type === 'goal') {
      if(goalBtn.classList.contains('active-goal')) {
        goalBtn.classList.remove('active-goal');
        if(goalCnt) goalCnt.textContent = fmtNum(Math.max(0, gCount - 1));
      } else {
        goalBtn.classList.add('active-goal');
        if(goalCnt) goalCnt.textContent = fmtNum(gCount + 1);
        if(redBtn && redBtn.classList.contains('active-red')) {
          redBtn.classList.remove('active-red');
          if(redCnt) redCnt.textContent = fmtNum(Math.max(0, rCount - 1));
        }
      }
    } else if(type === 'red') {
      if(redBtn.classList.contains('active-red')) {
        redBtn.classList.remove('active-red');
        if(redCnt) redCnt.textContent = fmtNum(Math.max(0, rCount - 1));
      } else {
        redBtn.classList.add('active-red');
        if(redCnt) redCnt.textContent = fmtNum(rCount + 1);
        if(goalBtn && goalBtn.classList.contains('active-goal')) {
          goalBtn.classList.remove('active-goal');
          if(goalCnt) goalCnt.textContent = fmtNum(Math.max(0, gCount - 1));
        }
      }
    }
  }

  const ref = db.collection("videos").doc(videoId);
  let ownerUidForNotif = null, becameActive=false;
  try {
    await db.runTransaction(async t=>{
      const doc = await t.get(ref);
      if(!doc.exists) return;
      const data = doc.data();
      ownerUidForNotif = data.ownerUid;
      const reactions = data.reactions || {};
      const current = reactions[u];
      let goalsCount = data.goalsCount||0, redCount = data.redCount||0;
      if(current === type){
        delete reactions[u];
        if(type==='goal') goalsCount--; else redCount--;
      } else {
        if(current==='goal') goalsCount--;
        if(current==='red') redCount--;
        reactions[u]=type;
        becameActive = true;
        if(type==='goal') goalsCount++; else redCount++;
      }
      t.update(ref,{reactions, goalsCount:Math.max(0,goalsCount), redCount:Math.max(0,redCount)});
    });
    if(becameActive && ownerUidForNotif) createNotification(ownerUidForNotif, type, {videoId});
  } catch(e) {
    console.error("Reaction failed:", e);
  }
}
async function toggleFollowChannel(targetUid){
  const u=uid(); if(!u||u===targetUid) return;
  const myRef = db.collection("users").doc(u);
  const theirRef = db.collection("users").doc(targetUid);
  const mySnap = await myRef.get();
  const list = mySnap.data().followingChannels || [];
  const isF = list.includes(targetUid);
  await db.runTransaction(async t=>{
    if(isF){
      t.update(myRef,{followingChannels:FieldValue.arrayRemove(targetUid), followingCount:FieldValue.increment(-1)});
      t.update(theirRef,{followersCount:FieldValue.increment(-1)});
    } else {
      t.update(myRef,{followingChannels:FieldValue.arrayUnion(targetUid), followingCount:FieldValue.increment(1)});
      t.update(theirRef,{followersCount:FieldValue.increment(1)});
    }
  });
  if(!isF) createNotification(targetUid, 'follow', {});
  const fresh = await myRef.get(); userData = fresh.data();
  updateFollowButtons();
  if(activeTab==='profile') renderProfilePanel();
}

function updateFollowButtons(){
  const slides = document.querySelectorAll('.video-slide');
  slides.forEach(s=>{
    const owner = s.dataset.owner;
    const btn = s.querySelector('[data-act="follow"]');
    if(!btn) return;
    const following = (userData && userData.followingChannels || []).includes(owner);
    btn.textContent = following ? 'متابَع' : 'متابعة';
    btn.classList.toggle('following', following);
    btn.style.background = following ? 'rgba(255,255,255,.15)' : '';
    btn.style.color = following ? '#fff' : '';
  });
}

let uploadFile=null;
function openUploadSheet(){
  uploadFile=null;
  openSheet(`
    <div class="sheet" style="height:82%">
      <div class="sheet-handle"></div>
      <div class="sheet-title">فيديو جديد</div>
      <div class="sheet-body">
        <label class="upload-drop" id="uploadDrop">
          <span class="lbl">اختر فيديو من جهازك</span>
          <input type="file" accept="video/*" id="uploadFileInput" style="display:none">
        </label>
        <textarea class="upload-ta" id="uploadDesc" placeholder="اكتب وصف ...  استخدم # لعمل هاشتاج مثال: #الأهلي"></textarea>
        <div class="upload-progress hidden" id="uploadProgWrap"><div class="bar" id="uploadBar"></div></div>
      </div>
      <div class="sheet-input-bar">
        <button id="uploadSubmitBtn" style="flex:1;background:var(--pitch);color:#08150d;border-radius:14px;font-weight:800;">تحميل</button>
      </div>
    </div>`);
  $("#uploadDrop").addEventListener("click",()=>$("#uploadFileInput").click());
  $("#uploadFileInput").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    if(!f.type || !f.type.startsWith('video/')){ toast('اختر ملف فيديو صالح'); return; }
    if(f.size > 300*1024*1024){ toast('حجم الفيديو كبير جدًا (الحد الأقصى 300 ميجا)'); return; }
    uploadFile=f;
    const url=URL.createObjectURL(f);
    $("#uploadDrop").innerHTML = `<video src="${url}" muted></video><span class="lbl">${esc(f.name)}</span>`;
  });
  $("#uploadSubmitBtn").addEventListener("click", submitUpload);
}
async function submitUpload(){
  if(!uploadFile){toast("اختر فيديو الأول");return;}
  const desc = sanitizeText($("#uploadDesc").value, 800);
  const hashtags = (desc.match(/#([\u0600-\u06FFa-zA-Z0-9_]+)/g)||[]).map(h=>h.slice(1));
  const btn=$("#uploadSubmitBtn"); btn.textContent="جاري الرفع...";
  $("#uploadProgWrap").classList.remove("hidden");
  const path = `videos/${uid()}/${Date.now()}_${uploadFile.name}`;
  const ref = storage.ref(path);
  const task = ref.put(uploadFile);
  task.on("state_changed", snap=>{
    const pct = Math.round(100*snap.bytesTransferred/snap.totalBytes);
    $("#uploadBar").style.width = pct+"%";
  }, err=>{
    console.error(err); toast("فشل الرفع: "+err.message); btn.textContent="تحميل";
  }, async ()=>{
    const videoURL = await ref.getDownloadURL();
    await db.collection("videos").add({
      videoURL, description:desc, hashtags, ownerUid:uid(), ownerName:userData.displayName,
      ownerPhoto:userData.photoURL||"", ownerFavTeam:userData.favTeam||null, ownerVerified:!!userData.verified,
      goalsCount:0, redCount:0, commentsCount:0, views:0,
      reactions:{}, createdAt:FieldValue.serverTimestamp()
    });
    try{ await db.collection("users").doc(uid()).update({videosCount:FieldValue.increment(1)});
      userData.videosCount = (userData.videosCount||0)+1; }catch(e){}
    toast("تم رفع الفيديو");
    closeSheet();
    switchTab("home");
  });
}

async function loadMatchCenterMatches(container, filter) {
  container.innerHTML = `<div class="loader">جاري تحميل المباريات من Football-Data...</div>`;

  let apiEndpoint = '';
  const todayStr = new Date().toISOString().split('T')[0];

  if(filter === 'today'){
    apiEndpoint = `matches?dateFrom=${todayStr}&dateTo=${todayStr}`;
  } else if(filter === 'live'){
    apiEndpoint = `matches?status=IN_PLAY,PAUSED`;
  } else if(filter === 'upcoming'){
    const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
    const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
    apiEndpoint = `matches?dateFrom=${tomorrow.toISOString().split('T')[0]}&dateTo=${nextWeek.toISOString().split('T')[0]}`;
  }

  const apiData = await fetchFootballData(apiEndpoint);

  let html = '';
  if(!FOOTBALL_DATA_API_KEY || FOOTBALL_DATA_API_KEY === "6e6dd669a96d463aac236438787c5ca3"){
  }

  if(apiData && apiData.matches && apiData.matches.length > 0) {
    html += apiData.matches.map(m => formatApiMatchCard(m)).join('');
    container.innerHTML = html;
    bindMatchCardEvents(container);
  } else if(apiData && apiData.matches && apiData.matches.length === 0) {
    html += `<div class="empty-state"><div class="big">${icon('matches')}</div>لا توجد مباريات متاحة لهذا الفلتر حالياً</div>`;
    container.innerHTML = html;
  } else {
    // Fallback to static matches array
    const filteredMatches = MATCHES;
    html += filteredMatches.map(m => formatMockMatchCard(m)).join('');
    container.innerHTML = html;
    bindMatchCardEvents(container);
  }
}

function formatApiMatchCard(m) {
  const isLive = m.status === 'IN_PLAY' || m.status === 'PAUSED';
  const statusLabel = isLive ? 'مباشر 🔴' : (m.status === 'FINISHED' ? 'انتهت' : new Date(m.utcDate).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}));
  const homeScore = m.score && m.score.fullTime && m.score.fullTime.home !== null ? m.score.fullTime.home : '-';
  const awayScore = m.score && m.score.fullTime && m.score.fullTime.away !== null ? m.score.fullTime.away : '-';
  const competitionName = (m.competition && m.competition.name) ? m.competition.name : 'مباراة دولية';
  const matchId = 'api_' + m.id;

  return `
    <div class="match-card ${isLive?'is-live':''}" data-match="${esc(matchId)}">
      <div class="match-header">
        <span class="match-league">${esc(competitionName)}</span>
        <span class="match-status ${isLive?'live':''}">${statusLabel}</span>
      </div>
      <div class="match-teams">
        <div class="team-box">
          <img src="${esc(m.homeTeam.crest || fallbackTeamAvatar(m.homeTeam.name))}" onerror="this.src='${fallbackTeamAvatar(m.homeTeam.name)}'">
          <div class="team-name">${esc(m.homeTeam.shortName || m.homeTeam.name)}</div>
        </div>
        <div class="match-score">${homeScore} : ${awayScore}</div>
        <div class="team-box">
          <img src="${esc(m.awayTeam.crest || fallbackTeamAvatar(m.awayTeam.name))}" onerror="this.src='${fallbackTeamAvatar(m.awayTeam.name)}'">
          <div class="team-name">${esc(m.awayTeam.shortName || m.awayTeam.name)}</div>
        </div>
      </div>
      <div class="match-actions">
        ${MATCH_REACT_EMOJIS.map(react=>`<button class="match-react-btn" data-match="${esc(matchId)}" data-react="${react.key}">${react.icon} ${react.label}</button>`).join('')}
      </div>
      <div class="match-meta">
        <button class="match-btn" data-act="details" data-mid="${m.id}">تفاصيل المباراة</button>
        <button class="match-btn" data-act="chat" data-match="${esc(matchId)}" data-title="${esc((m.homeTeam.shortName||m.homeTeam.name) + ' - ' + (m.awayTeam.shortName||m.awayTeam.name))}">شات الماتش</button>
      </div>
    </div>`;
}

function formatMockMatchCard(m) {
  const totalReacts = Object.values(m.reactions || {}).reduce((sum,v)=>sum+v, 0);
  return `
    <div class="match-card" data-match="${esc(m.id)}">
      <div class="match-header">
        <span class="match-league">${esc(m.league)}</span>
        <span class="match-status">${esc(m.status)} · ${esc(m.time)}</span>
      </div>
      <div class="match-teams">
        <div class="team-box">
          <img src="${m.homeCrest || fallbackTeamAvatar(m.home)}" onerror="this.src='${fallbackTeamAvatar(m.home)}'">
          <div class="team-name">${esc(m.home)}</div>
        </div>
        <div class="match-score">${m.scoreHome} : ${m.scoreAway}</div>
        <div class="team-box">
          <img src="${m.awayCrest || fallbackTeamAvatar(m.away)}" onerror="this.src='${fallbackTeamAvatar(m.away)}'">
          <div class="team-name">${esc(m.away)}</div>
        </div>
      </div>
      <div class="match-actions">
        ${MATCH_REACT_EMOJIS.map(react=>`<button class="match-react-btn" data-match="${esc(m.id)}" data-react="${react.key}">${react.icon} ${react.label} ${fmtNum((m.reactions&&m.reactions[react.key])||0)}</button>`).join('')}
      </div>
      <div class="match-meta">
        <span>التفاعلات ${fmtNum(totalReacts)}</span>
        <button class="match-btn" data-act="scorers" data-match="${esc(m.id)}">مين سجل</button>
        <button class="match-btn" data-act="chat" data-match="${esc(m.id)}" data-title="${esc(m.home + ' - ' + m.away)}">شات الماتش</button>
      </div>
    </div>`;
}

async function runSearch(q){
  if(!q) return;
  await db.collection("users").doc(uid()).update({searchHistory:FieldValue.arrayUnion(q)});
  const list=$("#searchList");
  list.innerHTML = `<div class="loader">جاري البحث...</div>`;
  const isHashtag = q.startsWith("#");
  const term = isHashtag ? q.slice(1) : q;
  let usersRes=[], videosRes=[];
  try{
    if(isHashtag){
      const vs = await db.collection("videos").where("hashtags","array-contains",term).limit(21).get();
      videosRes = vs.docs.map(d=>({id:d.id,...d.data()}));
    } else {
      const lower = term.toLowerCase();
      const us = await db.collection("users").orderBy("displayNameLower")
        .startAt(lower).endAt(lower+"\uf8ff").limit(10).get();
      usersRes = us.docs.map(d=>({id:d.id,...d.data()}));
      const vs = await db.collection("videos").where("hashtags","array-contains",term).limit(21).get();
      videosRes = vs.docs.map(d=>({id:d.id,...d.data()}));
    }
  }catch(e){ console.error(e); }
  list.innerHTML = `<div class="section-label">نتائج البحث عن "${esc(q)}"</div>`;
  if(usersRes.length){
    list.innerHTML += usersRes.map(u=>`
      <div class="sr-user" data-uid="${u.uid}">
        <img src="${esc(u.photoURL||'')}" onerror="this.style.background='#1c211c'">
        <div><div style="font-weight:800;font-size:13.5px;">${esc(u.displayName)}${verifiedBadge(u.verified)}</div>
        <div style="font-size:11px;color:var(--muted);">${fmtNum(u.followersCount)} متابع</div></div>
      </div>`).join("");
  }
  if(videosRes.length){
    list.innerHTML += `<div class="section-label">فيديوهات</div><div class="sr-vid-grid">` +
      videosRes.map(v=>`<div class="thumb" data-vid="${v.id}"><video src="${esc(v.videoURL)}" muted playsinline preload="metadata"></video><div class="vc">${icon('eye')} ${fmtNum(v.views)}</div></div>`).join("") + `</div>`;
    setTimeout(()=>{ list.querySelectorAll('.sr-vid-grid .thumb[data-vid]').forEach(t=>t.addEventListener('click', ()=>openVideoSheet(t.dataset.vid))); },60);
  }
  if(!usersRes.length && !videosRes.length){
    list.innerHTML += `<div class="empty-state" style="height:auto;padding:30px;"><div class="big">${icon('search')}</div>مفيش نتائج</div>`;
  }
  list.querySelectorAll(".sr-user").forEach(el=>el.addEventListener("click",()=>openOtherProfile(el.dataset.uid)));
}

async function castVarVote(postId, vote){
  const ref = db.collection("var_posts").doc(postId);
  await db.runTransaction(async t=>{
    const doc=await t.get(ref); const data=doc.data();
    const voters = data.voters||{};
    let yes=data.yesCount||0, no=data.noCount||0;
    const prev = voters[uid()];
    if(prev===vote){ return; }
    if(prev==='yes') yes--; if(prev==='no') no--;
    voters[uid()]=vote;
    if(vote==='yes') yes++; else no++;
    t.update(ref,{voters, yesCount:Math.max(0,yes), noCount:Math.max(0,no)});
  });
}

/* ===================== BADGES / ACHIEVEMENTS ===================== */
function computeAchievements(u){
  const badges = [];
  const followers = u.followersCount||0;
  const videos = u.videosCount||0;
  if(followers>=1000) badges.push({icon:'trophy', label:'نجم كورنر'});
  else if(followers>=100) badges.push({icon:'fire', label:'شعبية صاعدة'});
  if(videos>=50) badges.push({icon:'video', label:'صانع محتوى محترف'});
  else if(videos>=10) badges.push({icon:'video', label:'منتج نشيط'});
  if(u.verified) badges.push({icon:'verified', label:'حساب موثّق'});
  if(u.favTeam) badges.push({icon:'star', label:'جماهيري '+u.favTeam});
  if(badges.length===0) badges.push({icon:'users', label:'عضو في كورنر'});
  return badges;
}

    const qs = await db.collection("users").doc(targetUid).collection("lists").get();
    if(qs.empty){ body.innerHTML=`<div class="empty-state" style="height:auto;padding:30px;"><div class="big">${icon('bookmark')}</div>لسه مفيش قوائم محفوظة</div>`; return; }
    body.innerHTML = qs.docs.map(d=>{
      const l=d.data();
      return `<div class="list-tile" data-lid="${d.id}" title="فتح القائمة"><div class="n">${icon('bookmark')}</div><div class="lt-name">${esc(l.name)}</div><div style="color:var(--muted);font-weight:400;font-size:12px;margin-left:auto;">(${(l.videoIds||[]).length})</div></div>`;
    }).join("");
    body.querySelectorAll('.list-tile[data-lid]').forEach(el=>el.addEventListener('click', ()=> openListSheet(el.dataset.lid)));
  }
}

async function openListSheet(listId){
  const ref = db.collection('users').doc(uid()).collection('lists').doc(listId);
  const snap = await ref.get(); if(!snap.exists){ toast('القائمة غير موجودة'); return; }
  const list = snap.data();
  const vids = list.videoIds || [];
  openSheet(`
    <div class="sheet" style="height:75%">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${esc(list.name)}</div>
      <div class="sheet-body" id="listBody"><div class="loader">جاري التحميل...</div></div>
    </div>`);
  const body = document.getElementById('listBody');
  if(vids.length===0){ body.innerHTML=`<div class="empty-state" style="height:auto;padding:30px;"><div class="big">${icon('bookmark')}</div>لا توجد فيديوهات محفوظة</div>`; return; }
  const batches = [];
  for(const vid of vids){ batches.push(db.collection('videos').doc(vid).get()); }
  const docs = await Promise.all(batches);
  const videos = docs.filter(d=>d && d.exists).map(d=>({id:d.id,...d.data()}));
  body.innerHTML = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">` + videos.map(v=>`<div class="list-thumb" data-vid="${v.id}"><video src="${esc(v.videoURL)}" muted playsinline preload="metadata"></video><div style="font-size:12px;color:var(--muted);margin-top:6px">${esc(v.ownerName||'')}</div></div>`).join('') + `</div>`;
  body.querySelectorAll('.list-thumb').forEach(t=>t.addEventListener('click', ()=> openVideoSheet(t.dataset.vid)));
}

async function openVideoSheet(videoId){
  const snap = await db.collection('videos').doc(videoId).get(); if(!snap.exists){ toast('الفيديو غير موجود'); return; }
  const v = snap.data();
  openSheet(`
    <div class="sheet" style="height:78%">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${esc(v.ownerName||'مستخدم')}</div>
      <div class="sheet-body" id="videoSheetBody" style="display:flex;flex-direction:column;">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg-elev);border-radius:10px;overflow:hidden;padding:6px"><video id="sheetVideoPlayer" src="${esc(v.videoURL)}" controls playsinline style="width:100%;height:100%;object-fit:contain"></video></div>
        <div style="padding:10px 0"><div style="font-weight:800">${esc(v.description||'')}</div><div style="color:var(--muted);font-size:13px;margin-top:6px">${icon('eye')} ${fmtNum(v.views)} · ${icon('comment')} ${fmtNum(v.commentsCount||0)}</div></div>
      </div>
      <div class="sheet-input-bar"><button id="sheetSaveBtn">${icon('save')} حفظ</button><button id="sheetCommentsBtn">${icon('comment')} التعليقات</button><button id="sheetShareBtn">${icon('share')} مشاركة</button></div>
    </div>`);
  document.getElementById('sheetSaveBtn').addEventListener('click', ()=> openSaveSheet(videoId));
  document.getElementById('sheetCommentsBtn').addEventListener('click', ()=>{ closeSheet(); setTimeout(()=>openCommentsSheet(videoId),120); });
  document.getElementById('sheetShareBtn').addEventListener('click', ()=>{ openShareSheet(videoId); });
  maybeCountView(videoId);
  const player = document.getElementById('sheetVideoPlayer'); player.play().catch(()=>{});
}

function openOtherProfile(targetUid){
  switchTab("profile");
  renderProfilePanel(targetUid);
}

/* ===================== SETTINGS ===================== */
function renderSettingsPanel(){
  const panel=$("#panel-settings");
  panel.innerHTML = `
    <div class="settings-wrap">
      <div class="top-header" style="padding-top:0;border:none;">
        <span class="back" id="setBack">${icon('back')}</span><span class="t">الإعدادات</span>
      </div>
      <div class="set-section">
        <div class="set-label">الحساب</div>
        <div class="set-row"><span>الاسم</span><span>${esc(userData.displayName)}${verifiedBadge(userData.verified)}</span></div>
        <div class="set-row" id="changePhotoRow" style="cursor:pointer;"><span>تغيير الصورة</span><span>${icon('camera')}</span>
          <input type="file" accept="image/*" id="setPhotoInput" style="display:none"></div>
      </div>
      <div class="set-section">
        <div class="set-label">الإشعارات</div>
        <div class="set-row"><span>تفعيل الإشعارات</span><div class="toggle ${userData.notifications?'on':''}" id="notifToggle"></div></div>
      </div>
      <div class="set-section">
        <div class="set-label">الحساب والخصوصية</div>
        <button class="btn-danger" id="logoutBtn">تسجيل الخروج</button>
        <button class="btn-danger" id="deleteBtn">حذف الحساب نهائيًا</button>
      </div>
      <div class="footer-brand">CORNER by <b>BORKAN</b></div>
    </div>`;
  $("#setBack").addEventListener("click",()=>switchTab("profile"));
  $("#notifToggle").addEventListener("click", async ()=>{
    userData.notifications = !userData.notifications;
    await db.collection("users").doc(uid()).update({notifications:userData.notifications});
    renderSettingsPanel();
  });
  $("#changePhotoRow").addEventListener("click",()=>$("#setPhotoInput").click());
  $("#setPhotoInput").addEventListener("change", async e=>{
    const f=e.target.files[0]; if(!f) return;
    const ref=storage.ref(`profile_photos/${uid()}.jpg`);
    await ref.put(f); const url=await ref.getDownloadURL();
    await currentUser.updateProfile({photoURL:url});
    await db.collection("users").doc(uid()).update({photoURL:url});
    userData.photoURL=url; toast("تم تحديث الصورة"); renderSettingsPanel();
  });
  $("#logoutBtn").addEventListener("click", async ()=>{
    await auth.signOut(); location.reload();
  });
  $("#deleteBtn").addEventListener("click", async ()=>{
    if(!confirm("هل أنت متأكد من حذف الحساب نهائيًا؟")) return;
    try{
      await db.collection("users").doc(uid()).delete();
      await currentUser.delete();
      location.reload();
    }catch(e){ toast("يلزم تسجيل دخول حديث لحذف الحساب. سجل خروج ثم ادخل تاني وجرب."); }
  });
}
</script>
